services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shipkit
      POSTGRES_PASSWORD: shipkit
      POSTGRES_DB: shipkit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipkit -d shipkit"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build: ./collector
    environment:
      SHIPKIT_COLLECTOR_DATABASE_URL: postgresql+psycopg://shipkit:shipkit@postgres:5432/shipkit
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
