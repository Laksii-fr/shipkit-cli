[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipkit-collector"
version = "0.1.0"
description = "ShipKit log collector service: FastAPI + PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "psycopg[binary]>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
