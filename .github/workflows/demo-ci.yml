name: Demo monorepo CI

# Proves the composite Action works end-to-end against examples/monorepo.
on:
  push:
    paths:
      - "examples/monorepo/**"
      - "cli/**"
      - "action.yml"
      - ".github/workflows/demo-ci.yml"
  pull_request:
    paths:
      - "examples/monorepo/**"
      - "cli/**"
      - "action.yml"
      - ".github/workflows/demo-ci.yml"
  workflow_dispatch:

jobs:
  shipkit-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Change-aware CI (examples/monorepo)
        uses: ./
        with:
          base: ${{ github.event.repository.default_branch || 'main' }}
          config: shipkit.yml
          repo: examples/monorepo
          max-workers: "4"

      - name: Full matrix smoke (--all)
        uses: ./
        with:
          config: shipkit.yml
          repo: examples/monorepo
          all: "true"
          max-workers: "4"
